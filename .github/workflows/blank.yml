name: Build World War APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev \
            libncurses5-dev libncursesw5-dev \
            cmake libltdl-dev

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/9.0/bin/sdkmanager"
          fi

          test -f "$SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -f "$ANDROID_HOME/build-tools/35.0.0/aidl"

          echo "AIDL installed successfully"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36

      - name: Configure Buildozer SDK
        run: |
          sed -i '/^android.sdk_path =/d' buildozer.spec
          sed -i '/^android.skip_update =/d' buildozer.spec
          sed -i '/^android.accept_sdk_license =/d' buildozer.spec

          printf '\nandroid.sdk_path = %s\n' "$ANDROID_HOME" >> buildozer.spec
          printf 'android.skip_update = True\n' >> buildozer.spec
          printf 'android.accept_sdk_license = True\n' >> buildozer.spec

      - name: Build APK
        run: |
          mkdir -p "$HOME/.buildozer/android/platform"

          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"

          if [ ! -e "$SDK_DIR" ]; then
            ln -s "$ANDROID_HOME" "$SDK_DIR"
          fi

          mkdir -p "$ANDROID_HOME/tools/bin"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/9.0/bin/sdkmanager"
          fi

          test -f "$SDKMANAGER"

          ln -sfn "$SDKMANAGER" \
            "$ANDROID_HOME/tools/bin/sdkmanager"

          echo "Checking sdkmanager:"
          "$ANDROID_HOME/tools/bin/sdkmanager" --version

          echo "Checking AIDL:"
          ls -l "$ANDROID_HOME/build-tools/35.0.0/aidl"

          buildozer android debug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: World-War-APK
          path: bin/*.apk
          if-no-files-found: warn
