name: Build World War APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-22.04
steps:
- name: Checkout repository
uses: actions/checkout@v4

```
  - name: Check game files
    run: |
      echo "Checking repository files..."
      ls -la
      if [ ! -f main.py ]; then
        echo "ERROR: main.py is missing."
        exit 1
      fi
      echo "main.py found."
